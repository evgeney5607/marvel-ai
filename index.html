<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MARVEL AI</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
}

header {
  background: #e10600;
  padding: 22px;
  text-align: center;
  font-size: 28px;
  font-weight: bold;
}

main {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

#status, #chat {
  background: #222;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 15px;
}

#chat {
  min-height: 180px;
  white-space: pre-wrap;
}

.input {
  display: flex;
  gap: 8px;
}

input {
  flex: 1;
  padding: 14px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
}

button {
  background: #e10600;
  color: white;
  border: none;
  border-radius: 10px;
  padding: 14px;
  font-weight: bold;
}
</style>
</head>

<body>

<header>MARVEL AI</header>

<main>

<h2>🤖 MARVEL AI</h2>

<div id="status">Проверяю поддержку локального ИИ...</div>

<div id="chat">Запуск...</div>

<div class="input">
<input id="message" placeholder="Напиши сообщение...">
<button onclick="send()">➤</button>
</div>

</main>

<script type="module">

const status = document.getElementById("status");
const chat = document.getElementById("chat");

try {

  if (!("gpu" in navigator)) {
    throw new Error(
      "WebGPU не поддерживается этим браузером или устройством."
    );
  }

  status.textContent =
    "🟢 WebGPU найден. Загружаю WebLLM...";

  const { CreateMLCEngine } =
    await import("https://esm.run/@mlc-ai/web-llm");

  const model =
    "Llama-3.1-8B-Instruct-q4f32_1-MLC";

  status.textContent =
    "⏳ Загружаю модель ИИ...";

  window.engine = await CreateMLCEngine(
    model,
    {
      initProgressCallback: (progress) => {

        status.textContent =
          "⏳ Загрузка ИИ: " +
          Math.round(progress.progress * 100) +
          "%";

      }
    }
  );

  status.textContent =
    "🟢 MARVEL AI готов!";

  chat.textContent =
    "🤖 Привет! Я MARVEL AI.\n\n" +
    "Локальный ИИ успешно запустился!";

} catch (error) {

  status.textContent =
    "❌ ИИ не запустился";

  chat.textContent =
    "Причина ошибки:\n\n" +
    error.message +
    "\n\nКод ошибки:\n" +
    error.name;

  console.error(error);

}


window.send = async function() {

  if (!window.engine) {

    chat.textContent =
      "❌ Нейросеть ещё не запустилась.";

    return;

  }

  const input =
    document.getElementById("message");

  const text =
    input.value.trim();

  if (!text) return;

  chat.textContent =
    "🤖 Думаю...";

  try {

    const response =
      await window.engine.chat.completions.create({

        messages: [

          {
            role: "system",
            content:
              "Ты MARVEL AI. Отвечай на русском языке."
          },

          {
            role: "user",
            content: text
          }

        ],

        temperature: 0.7,

        max_tokens: 300

      });

    chat.textContent =
      "🤖 MARVEL AI:\n\n" +
      response.choices[0].message.content;

  } catch (error) {

    chat.textContent =
      "❌ Ошибка ответа:\n\n" +
      error.message;

  }

  input.value = "";

};

</script>

</body>
</html>
