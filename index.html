<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MARVEL AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fff;
  color: #111;
}

header {
  background: #e10600;
  color: white;
  padding: 22px;
  text-align: center;
  font-size: 28px;
  font-weight: bold;
}

main {
  padding: 20px;
  max-width: 700px;
  margin: auto;
}

h1 {
  font-size: 25px;
}

.subtitle {
  color: #555;
}

.buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 20px 0;
}

button {
  border: none;
  border-radius: 12px;
  padding: 15px;
  font-size: 16px;
  background: #f1f1f1;
}

button:active {
  transform: scale(.98);
}

#result {
  white-space: pre-wrap;
  background: #f5f5f5;
  border-radius: 14px;
  padding: 16px;
  min-height: 100px;
  margin-top: 15px;
}

.input {
  display: flex;
  gap: 8px;
  margin-top: 15px;
}

input {
  flex: 1;
  padding: 15px;
  border: 2px solid #ddd;
  border-radius: 12px;
  font-size: 16px;
}

.send {
  background: #e10600;
  color: white;
  font-weight: bold;
}
</style>
</head>

<body>

<header>MARVEL AI</header>

<main>
  <h1>Привет! Я — MARVEL AI.</h1>
  <p class="subtitle">Твой личный ИИ-помощник. Что хочешь сделать сегодня?</p>

  <div class="buttons">
    <button onclick="quick('Помоги мне с учёбой')">📚 Учёба</button>
    <button onclick="quick('Придумай идею')">💡 Идеи</button>
    <button onclick="quick('Создай сайт')">💻 Создать сайт</button>
    <button onclick="quick('Напиши код')">🧑‍💻 Код</button>
  </div>

  <div id="result">MARVEL AI готов к работе.</div>

  <div class="input">
    <input id="message" placeholder="Напиши сообщение...">
    <button class="send" onclick="send()">➤</button>
  </div>
</main>

<script>
function quick(text) {
  document.getElementById("message").value = text;
  send();
}

function send() {
  const input = document.getElementById("message");
  const result = document.getElementById("result");
  const text = input.value.trim().toLowerCase();

  if (!text) return;

  if (text.includes("сайт") || text.includes("код")) {
    result.textContent =
      "💻 MARVEL AI\n\nВот пример сайта:\n\n" +
      "<!DOCTYPE html>\\n" +
      "<html>\\n" +
      "<head><title>Мой сайт</title></head>\\n" +
      "<body>\\n" +
      "<h1>Привет!</h1>\\n" +
      "<p>Это мой первый сайт.</p>\\n" +
      "</body>\\n" +
      "</html>";
  }

  else if (
    text.includes("учёб") ||
    text.includes("учеб") ||
    text.includes("математ")
  ) {
    result.textContent =
      "📚 MARVEL AI\n\n" +
      "Я могу помочь разобраться с заданием по шагам. " +
      "Напиши само задание.";
  }

  else if (
    text.includes("иде")
  ) {
    result.textContent =
      "💡 Идея:\n\n" +
      "Сделай MARVEL AI приложением, которое умеет создавать сайты " +
      "по обычному описанию пользователя.";
  }

  else {
    result.textContent =
      "🤖 MARVEL AI\n\n" +
      "Сейчас это бесплатная версия без подключения внешней нейросети.\n\n" +
      "Но интерфейс уже готов, и следующим этапом можно подключить настоящую модель.";
  }

  input.value = "";
}
</script>

</body>
</html>
