<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MARVEL AI — Local AI</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
}

header {
  background: #e10600;
  padding: 22px;
  text-align: center;
  font-size: 28px;
  font-weight: bold;
}

main {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

#status {
  background: #222;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 15px;
}

#chat {
  background: #1d1d1d;
  padding: 15px;
  border-radius: 12px;
  min-height: 180px;
  white-space: pre-wrap;
}

.input {
  display: flex;
  gap: 8px;
  margin-top: 15px;
}

input {
  flex: 1;
  padding: 14px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
}

button {
  background: #e10600;
  color: white;
  border: none;
  border-radius: 10px;
  padding: 14px;
  font-weight: bold;
}
</style>
</head>

<body>

<header>MARVEL AI</header>

<main>

<h2>🤖 Локальный ИИ</h2>

<div id="status">
Загрузка нейросети...
</div>

<div id="chat">
MARVEL AI запускается...
</div>

<div class="input">
<input id="message" placeholder="Напиши сообщение...">
<button onclick="send()">➤</button>
</div>

</main>

<script type="module">

import { CreateMLCEngine }
from "https://esm.run/@mlc-ai/web-llm";

const model = "Llama-3.1-8B-Instruct-q4f32_1-MLC";

let engine;

async function startAI() {

  const status = document.getElementById("status");

  try {

    status.textContent = "⏳ Загружаю модель...";

    engine = await CreateMLCEngine(
      model,
      {
        initProgressCallback: (progress) => {
          status.textContent =
            "⏳ Загрузка ИИ: " +
            Math.round(progress.progress * 100) +
            "%";
        }
      }
    );

    status.textContent =
      "🟢 MARVEL AI готов!";

    document.getElementById("chat").textContent =
      "🤖 Привет! Я локальный ИИ MARVEL AI.\n\n" +
      "Напиши мне сообщение.";

  } catch (error) {

    status.textContent =
      "❌ Не удалось запустить ИИ.";

    document.getElementById("chat").textContent =
      "Ошибка: " + error.message;

    console.error(error);
  }
}

async function send() {

  if (!engine) {
    alert("Подожди, нейросеть ещё загружается.");
    return;
  }

  const input = document.getElementById("message");
  const chat = document.getElementById("chat");

  const text = input.value.trim();

  if (!text) return;

  chat.textContent = "🤖 Думаю...";

  try {

    const response =
      await engine.chat.completions.create({

        messages: [
          {
            role: "system",
            content:
              "Ты MARVEL AI — дружелюбный ИИ-помощник. Отвечай на русском."
          },
          {
            role: "user",
            content: text
          }
        ],

        temperature: 0.7,
        max_tokens: 300
      });

    chat.textContent =
      "🤖 MARVEL AI:\n\n" +
      response.choices[0].message.content;

  } catch (error) {

    chat.textContent =
      "❌ Ошибка: " + error.message;
  }

  input.value = "";
}

window.send = send;

startAI();

</script>

</body>
</html>
